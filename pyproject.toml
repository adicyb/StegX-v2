[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stegx"
version = "2.1.1"
description = "Secure media steganography toolkit with CLI and Web Console."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "cryptography>=49.0.0",
    "opencv-python",
    "pillow",
    "rich",
    "typer",
    "streamlit",
]

[project.urls]
Homepage = "https://github.com/adicyb/StegX-v2"
Repository = "https://github.com/adicyb/StegX-v2"
Issues = "https://github.com/adicyb/StegX-v2/issues"

[project.scripts]
stegx = "stegx.cli:main"
stegx-web = "stegx.ui.launcher:main"

[tool.setuptools.packages.find]
include = ["stegx*"]